name: Admiralty checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: admiralty-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  rust-and-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Prepare private test scratch outside the checkout
        run: |
          install -d -m 700 "$RUNNER_TEMP/admiralty-tests"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/admiralty-tests" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tests/legacy -v
      - run: python3 -m unittest discover -s tests -p 'test_sc_audit*.py' -v
      - run: python3 tests/fixtures/legacy/verify.py
      - run: python3 scripts/release/package.py --self-test
      - run: python3 scripts/check/canary-smoke.py --self-test
      - run: cargo build -p admiralty-server -p admiralty-cli --locked
      - name: Smoke actual isolated binaries
        run: |
          install -d -m 700 "$RUNNER_TEMP/admiralty-canary"
          python3 scripts/check/canary-smoke.py --admiraltyd-binary "$GITHUB_WORKSPACE/target/debug/admiraltyd" --admiralty-binary "$GITHUB_WORKSPACE/target/debug/admiralty" --scratch-root "$RUNNER_TEMP/admiralty-canary"
      - run: cargo run -p admiralty-cli --locked -- contracts check
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.15.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm contracts:check
      - run: pnpm --dir packages/contracts test
      - run: pnpm --dir apps/dashboard typecheck
      - run: pnpm --dir apps/dashboard test --run
      - run: pnpm --dir apps/dashboard build
