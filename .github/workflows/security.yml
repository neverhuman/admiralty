name: Security and Supply-Chain Qualification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-supply-chain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      # Toolchain extraction requires the fleet's shared NVMe storage capability.
      labels: [self-hosted, Linux, X64, lan-ci, storage-nvme]
    timeout-minutes: 15
    steps:
      - name: Record selected runner
        run: printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare private test scratch outside the checkout
        run: |
          umask 077
          scratch=$(mktemp -d /tmp/adm-sec.XXXXXX)
          test "$(stat -c %a "$scratch")" = 700
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: |
          export CARGO_HOME="$RUNNER_TEMP/admiralty-cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/admiralty-rustup"
          installer_dir="$RUNNER_TEMP/admiralty-rustup-bootstrap"
          install -d -m 700 "$CARGO_HOME" "$RUSTUP_HOME" "$installer_dir"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          installer="$installer_dir/rustup-init"
          # Official versioned Rust archive and its published SHA-256 metadata:
          # https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init.sha256
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 90 --max-filesize 33554432 \
            --output "$installer" https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
          printf '%s  %s\n' 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 "$installer" | sha256sum --check --status
          chmod u+x "$installer"
          "$installer" -y --no-modify-path --profile minimal --default-toolchain none
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.95.0 --profile minimal
      - name: Provision pinned actionlint 1.7.8 and gitleaks 8.21.2 in private job scratch when absent
        run: |
          set -euo pipefail
          umask 077
          bin_dir="${TMPDIR}/bin"
          mkdir -p "${bin_dir}"
          chmod 700 "${bin_dir}"
          if ! command -v actionlint >/dev/null 2>&1; then
            archive="${TMPDIR}/actionlint_1.7.8_linux_amd64.tar.gz"
            curl -fsSL -o "${archive}" "https://github.com/rhysd/actionlint/releases/download/v1.7.8/actionlint_1.7.8_linux_amd64.tar.gz"
            echo "be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a  ${archive}" | sha256sum -c -
            tar -xzf "${archive}" -C "${bin_dir}" actionlint
            chmod 700 "${bin_dir}/actionlint"
          fi
          if ! command -v gitleaks >/dev/null 2>&1; then
            archive="${TMPDIR}/gitleaks_8.21.2_linux_x64.tar.gz"
            curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
            echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  ${archive}" | sha256sum -c -
            tar -xzf "${archive}" -C "${bin_dir}" gitleaks
            chmod 700 "${bin_dir}/gitleaks"
          fi
          printf '%s\n' "${bin_dir}" >> "$GITHUB_PATH"
      - name: Run enforced workflow, secret, and lockfile supply-chain checks (actionlint, gitleaks, cargo metadata --locked)
        env:
          ADMIRALTY_SECURITY_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tools/security-lane.sh
