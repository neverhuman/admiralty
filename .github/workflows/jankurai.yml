name: Jankurai Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  jankurai-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Jankurai v1.7.5 in job scratch
        run: |
          set -euo pipefail
          umask 077
          tools_dir="${RUNNER_TEMP}/jankurai-tools"
          install -d -m 700 "${tools_dir}"
          installer="${tools_dir}/jankurai-installer.sh"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 90 --max-filesize 1048576 \
            --output "${installer}" https://github.com/neverhuman/jankurai-audit/releases/download/v1.7.5/jankurai-installer.sh
          # Official release asset digest; the pinned installer verifies the
          # binary signature, checksum, archive inventory and source provenance.
          printf '%s  %s\n' 828e513628080823a9afaa19eeaeee4ce2e54174483a11cdde00073dbafb895f "${installer}" | sha256sum --check --status
          bash "${installer}" --tag v1.7.5 --install-dir "${tools_dir}/bin"
          audit_binary="${tools_dir}/bin/jankurai"
          test "$("${audit_binary}" --version)" = 'jankurai 1.7.5'
          sha256sum "${audit_binary}"
          "${audit_binary}" audit --help > "${tools_dir}/audit-help.txt"
          for flag in --read-only --no-badge --no-score-history --repair-queue-jsonl; do
            grep -q -- "${flag}" "${tools_dir}/audit-help.txt"
          done
          printf 'JANKURAI_BIN=%s\n' "${audit_binary}" >> "${GITHUB_ENV}"
      - name: Report read-only onboarding baseline and emit repair queue
        run: |
          set -euo pipefail
          umask 077
          # Fail on stale output rather than treating an old report as success.
          mkdir "${RUNNER_TEMP}/jankurai"
          "${JANKURAI_BIN}" audit . \
            --read-only \
            --no-badge \
            --no-score-history \
            --mode advisory \
            --json "${RUNNER_TEMP}/jankurai/repo-score.json" \
            --md "${RUNNER_TEMP}/jankurai/repo-score.md" \
            --github-step-summary "${RUNNER_TEMP}/jankurai/step-summary.md" \
            --repair-queue-jsonl "${RUNNER_TEMP}/jankurai/repair-queue.jsonl"
          test -s "${RUNNER_TEMP}/jankurai/repo-score.json"
          test -s "${RUNNER_TEMP}/jankurai/repo-score.md"
          test -f "${RUNNER_TEMP}/jankurai/repair-queue.jsonl"
          test -s "${RUNNER_TEMP}/jankurai/step-summary.md"
          # SC-DEC-186J explicitly accepts baseline reporting for onboarding.
          # This is not strict conformance: the original 85 findings / 56
          # blockers remain in JANKURAI_CLEANUP_BACKLOG.md. Rust's python_policy
          # integration target rejects new Python and exception regressions in
          # both the full local gate and the rust-and-legacy hosted job.
          printf '%s\n' 'Baseline reporting only; strict audit debt remains open. See JANKURAI_CLEANUP_BACKLOG.md.' >> "${GITHUB_STEP_SUMMARY}"
          # Actions pre-creates its summary file; keep the auditor's fresh-output
          # guard intact, then append the independently generated summary.
          cat "${RUNNER_TEMP}/jankurai/step-summary.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Jankurai audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jankurai-audit-report
          path: |
            ${{ runner.temp }}/jankurai/repo-score.json
            ${{ runner.temp }}/jankurai/repo-score.md
            ${{ runner.temp }}/jankurai/repair-queue.jsonl
            ${{ runner.temp }}/jankurai/step-summary.md
          if-no-files-found: warn
