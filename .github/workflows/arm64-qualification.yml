name: ARM64 runner qualification

on:
  pull_request:
    paths: [.github/workflows/arm64-qualification.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admiralty-arm64-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-harnesses:
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, ARM64, lan-ci]
    timeout-minutes: 5
    steps:
      - name: Verify runner platform and installed tools
        run: |
          set -eu
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          case "$(uname -m)" in aarch64|arm64) ;; *) exit 1 ;; esac
          printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          uname -srmo
          git --version
          python3 --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record checkout and prepare private scratch
        run: |
          printf 'checkout=%s event_sha=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
          install -d -m 700 "$RUNNER_TEMP/admiralty-arm64-tests"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/admiralty-arm64-tests" >> "$GITHUB_ENV"
      - name: Run offline legacy regressions
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests/legacy -v
      - name: Run offline audit regressions
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p 'test_sc_audit*.py' -v
        run: python3 -m unittest discover -s tests -p 'test_native_queue_health.py' -v
      - name: Verify retained source fixtures
        timeout-minutes: 1
        run: python3 tests/fixtures/legacy/verify.py

# This proves placement and the named offline harnesses on Linux ARM64.
# Rust/provider execution, host-egress isolation and full native fleet
# qualification require separate evidence. The existing X64 CI is unchanged.
