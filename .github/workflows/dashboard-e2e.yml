name: Dashboard E2E & Accessibility Qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admiralty-dashboard-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  dashboard-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, browser158]
    timeout-minutes: 15
    steps:
      - name: Record selected runner
        run: printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare private test scratch outside the checkout
        run: |
          umask 077
          scratch=$(mktemp -d /tmp/adm-e2e.XXXXXX)
          test "$(stat -c %a "$scratch")" = 700
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned Rust and build native observation binaries from exact checked-out source
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          export CARGO_HOME="$RUNNER_TEMP/admiralty-cargo"
          export RUSTUP_HOME="$RUNNER_TEMP/admiralty-rustup"
          installer_dir="$RUNNER_TEMP/admiralty-rustup-bootstrap"
          install -d -m 700 "$CARGO_HOME" "$RUSTUP_HOME" "$installer_dir"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          installer="$installer_dir/rustup-init"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 120 --connect-timeout 10 --max-time 90 --max-filesize 33554432 \
            --output "$installer" https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
          printf '%s  %s\n' 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 "$installer" | sha256sum --check --status
          chmod u+x "$installer"
          "$installer" -y --no-modify-path --profile minimal --default-toolchain none
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup toolchain install 1.95.0 --profile minimal
          cargo build --locked -p admiralty-server --bin admiraltyd
          cargo build --locked -p admiralty-observe --bin admiralty-observe
          test -x "$GITHUB_WORKSPACE/target/debug/admiralty-observe"
          test -x "$GITHUB_WORKSPACE/target/debug/admiraltyd"
          printf 'ADMIRALTY_E2E_ADMIRALTYD_BIN=%s\nADMIRALTYD_BINARY=%s\n' "$GITHUB_WORKSPACE/target/debug/admiraltyd" "$GITHUB_WORKSPACE/target/debug/admiraltyd" >> "$GITHUB_ENV"
          native_binary_sha256="$(sha256sum "$GITHUB_WORKSPACE/target/debug/admiraltyd")"
          native_binary_sha256="${native_binary_sha256%% *}"
          printf 'ADMIRALTY_E2E_ADMIRALTYD_SHA256=%s\n' "$native_binary_sha256" >> "$GITHUB_ENV"
          printf 'ADMIRALTY_E2E_OBSERVER_BIN=%s\n' "$GITHUB_WORKSPACE/target/debug/admiralty-observe" >> "$GITHUB_ENV"
          sha256sum "$GITHUB_WORKSPACE/target/debug/admiraltyd" "$GITHUB_WORKSPACE/target/debug/admiralty-observe"
      - name: Verify or provision qualified Chromium/Chrome binary in job scratch
        run: |
          set -euo pipefail
          browser_bin=""
          # Executability alone does not qualify a wrapper or installed browser.
          # Preserve each failed probe and try the remaining actual candidates.
          probe_browser() {
            local candidate="$1" version_out probe_exit
            if version_out=$(timeout 10s "$candidate" --version 2>&1); then
              case "$version_out" in
                *Chrome*|*Chromium*)
                  printf 'verified_browser=%s version=%s\n' "$candidate" "$version_out"
                  browser_bin="$candidate"
                  return 0 ;;
              esac
              printf 'rejected_browser=%s unexpected_version=%s\n' "$candidate" "$version_out" >&2
            else
              probe_exit=$?
              printf 'rejected_browser=%s probe_exit=%s diagnostic=%s\n' "$candidate" "$probe_exit" "$version_out" >&2
            fi
            return 1
          }
          for candidate in \
            "${ADMIRALTY_BROWSER_BINARY:-}" \
            /opt/google/chrome/chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/google-chrome \
            /usr/bin/chromium \
            /usr/bin/chromium-browser \
            "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome \
            "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              if probe_browser "$candidate"; then break; fi
            fi
          done
          if [ -z "$browser_bin" ]; then
            install -d -m 700 "$RUNNER_TEMP/adm-chrome"
            npx --yes @puppeteer/browsers@2.5.0 install chrome@stable --path "$RUNNER_TEMP/adm-chrome"
            for candidate in "$RUNNER_TEMP"/adm-chrome/chrome/*/chrome-linux64/chrome; do
              if [ -x "$candidate" ]; then
                if probe_browser "$candidate"; then break; fi
              fi
            done
          fi
          if [ -z "$browser_bin" ] || [ ! -x "$browser_bin" ]; then
            echo "ERROR: No qualified Chromium/Chrome binary available on runner $RUNNER_NAME" >&2
            exit 1
          fi
          for sandbox_candidate in \
            "$(dirname "$browser_bin")/chrome_sandbox" \
            "$(dirname "$browser_bin")/chrome-sandbox" \
            /opt/google/chrome/chrome-sandbox; do
            if [ -u "$sandbox_candidate" ] && [ -x "$sandbox_candidate" ]; then
              printf 'CHROME_DEVEL_SANDBOX=%s\n' "$sandbox_candidate" >> "$GITHUB_ENV"
              printf 'verified_setuid_sandbox=%s\n' "$sandbox_candidate"
              break
            fi
          done
          printf 'apparmor_restrict_unprivileged_userns=%s unprivileged_userns_clone=%s\n' \
            "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo unavailable)" \
            "$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo unavailable)"
          printf 'ADMIRALTY_BROWSER_BINARY=%s\n' "$browser_bin" >> "$GITHUB_ENV"
      - name: Prepare pinned pnpm in job scratch
        run: |
          install -d -m 700 "$RUNNER_TEMP/admiralty-pnpm"
          npm install --global --prefix "$RUNNER_TEMP/admiralty-pnpm" pnpm@11.15.1 --ignore-scripts --no-audit --no-fund
          printf '%s\n' "$RUNNER_TEMP/admiralty-pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify pinned axe-core 4.14.0 from lockfile
        run: |
          test -f node_modules/axe-core/axe.min.js
          actual_sha=$(sha256sum node_modules/axe-core/axe.min.js | awk '{print $1}')
          expected_sha="20c09fe157a8a34a30e241aaa1fcdade657734f08ab379ecfbeb7d45cc46e878"
          test "$actual_sha" = "$expected_sha"
      - run: pnpm --dir apps/dashboard typecheck
      - run: pnpm --dir apps/dashboard exec tsc -p e2e/tsconfig.json --noEmit
      - name: Build fresh dashboard bundle from exact checked-out source
        run: |
          rm -rf apps/dashboard/dist
          NODE_ENV=production pnpm --dir apps/dashboard build
      - name: Run browser E2E and pinned axe-core 4.14.0 WCAG 2.1 AA qualification against built dashboard
        run: pnpm --dir apps/dashboard test --run --config e2e/vitest.config.ts
