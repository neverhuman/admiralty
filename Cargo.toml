[package]
name = "admiralty-round16-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autolib = false
autotests = false

[dependencies]
admiralty-core.workspace = true
admiralty-store.workspace = true
admiralty-runtime.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[test]]
name = "codex_round16_p05_p15"
path = "tests/integration/codex_round16_p05_p15.rs"

[[test]]
name = "codex_round16_p20"
path = "tests/integration/codex_round16_p20.rs"

[[test]]
name = "codex_round16_p25_p30"
path = "tests/integration/codex_round16_p25_p30.rs"

[[test]]
name = "codex_round16_p27"
path = "tests/integration/codex_round16_p27.rs"

[[test]]
name = "codex_round17_p05_p15"
path = "tests/integration/codex_round17_p05_p15.rs"

[workspace]
members = [".", "crates/admiralty-core", "crates/admiralty-store", "crates/admiralty-runtime", "crates/admiralty-server", "crates/admiralty-cli", "crates/admiralty-testkit", "crates/admiralty-integration-tests"]
default-members = [".", "crates/admiralty-core", "crates/admiralty-store", "crates/admiralty-runtime", "crates/admiralty-server", "crates/admiralty-cli", "crates/admiralty-testkit", "crates/admiralty-integration-tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
admiralty-core = { path = "crates/admiralty-core" }
admiralty-store = { path = "crates/admiralty-store" }
admiralty-runtime = { path = "crates/admiralty-runtime" }
admiralty-server = { path = "crates/admiralty-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2.0"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
fs2 = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
tempfile = "3.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
axum = "0.8.9"
futures-util = "0.3"
clap = { version = "4.5", features = ["derive"] }

[[test]]
name = "codex_round17_p20"
path = "tests/integration/codex_round17_p20.rs"
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
