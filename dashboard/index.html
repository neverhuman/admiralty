<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Captains — live ToDo progress · hierarchy · token efficiency</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#2a313c;--fg:#e6edf3;--mut:#8b949e;--ok:#3fb950;--prog:#d29922;--bad:#f85149;--open:#30363d;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:18px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}.mut{color:var(--mut)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.sum{display:flex;gap:10px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:150px}
.chip b{font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(620px,1fr));gap:14px;padding:14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.bar{height:16px;background:var(--open);border-radius:8px;overflow:hidden;display:flex;margin:8px 0 4px}
.bar span{display:block;height:100%}.done{background:var(--ok)}.inprog{background:var(--prog)}.blk{background:var(--bad)}
.counts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 4px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0e13;border:1px solid var(--line);border-radius:6px;padding:8px;margin:4px 0;max-height:190px;overflow:auto;font-size:11.5px}
.flag{background:rgba(248,81,73,.12);border:1px solid var(--bad);color:#ffb3ad;border-radius:6px;padding:5px 8px;margin:3px 0}
.pill{border-radius:10px;padding:1px 8px;font-size:11px;border:1px solid var(--line)}.p-ok{color:var(--ok);border-color:var(--ok)}.p-bad{color:var(--bad);border-color:var(--bad)}.p-prog{color:var(--prog);border-color:var(--prog)}
.new{animation:flash 3s}@keyframes flash{from{background:rgba(63,185,80,.35)}to{background:transparent}}
a{color:var(--acc)}.stale{color:var(--bad)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1900px){.layout{grid-template-columns:minmax(0,1fr) 980px}.side{border-left:1px solid var(--line)}}
.side{padding:14px 20px 14px 14px;display:flex;flex-direction:column;gap:14px}
.side .card h2{font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.kpi{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.kpi b{font-size:18px;display:block}.kpi .mut{font-size:11px}
.mbar{display:flex;align-items:center;gap:6px;margin:2px 0}.mbar .lbl{width:210px;font-size:12px}.mbar .trk{flex:1;background:#0b0e13;border-radius:4px;height:14px;overflow:hidden}.mbar .trk span{display:block;height:100%}
.t-cheap{background:#3fb950}.t-mid{background:#d29922}.t-top{background:#f85149}.t-agy{background:#58a6ff}.t-claude{background:#bc8cff}.t-unk{background:#6e7681}
.badge{display:inline-block;border-radius:4px;padding:0 5px;font-size:10.5px;color:#0e1116;font-weight:600;white-space:nowrap}
.chain{display:flex;align-items:stretch;gap:8px;margin:4px 0 10px}.node{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:6px 10px;flex:1}.node b{display:block}.arrow{align-self:center;color:var(--mut);font-size:18px}
.node.sc{border-color:var(--acc)}
.capcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative}
.capcol{background:#0b0e13;border:1px solid var(--line);border-radius:8px;padding:6px}
.caphead{border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.wk{padding:3px 2px;border-bottom:1px dashed #20262e;font-size:11.5px;line-height:1.3}.wk .nm{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.s-active{background:#3fb950}.s-idle{background:#d29922}.s-blocked{background:#f85149}.s-finished,.s-gone{background:#484f58}.s-remote{background:#58a6ff}.s-unknown{background:#6e7681}
.lv-red{color:#ff7b72;font-weight:600}.lv-amber{color:#e3b341;font-weight:600}.lv-ok{color:var(--ok)}
.warn-red{background:rgba(248,81,73,.14);border:1px solid var(--bad);border-radius:6px;padding:4px 8px;margin:3px 0;color:#ffb3ad}
.warn-amber{background:rgba(210,153,34,.14);border:1px solid var(--prog);border-radius:6px;padding:4px 8px;margin:3px 0;color:#f2cc60}
.small{font-size:11.5px}

.strip{display:flex;gap:6px;padding:6px 20px;border-bottom:1px solid var(--line);overflow-x:auto;background:#0b0e13}
.mini{flex:0 0 auto;width:186px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer}
.mini .tt{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini .vv{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini svg{display:block;width:100%;height:34px}.mini.big{width:520px}.mini.big svg{height:150px}.mini .lg{font-size:9.5px;color:var(--mut);white-space:nowrap;overflow:hidden}
.mini .nod{height:34px;display:flex;align-items:center;color:var(--mut);font-size:11px}.mini.big .nod{height:150px}
</style></head><body>
<header><h1>4 Captains · live ToDo progress <span class="mut" style="font-size:13px">+ super_captain · hierarchy · token efficiency</span></h1><div class="sum" id="sum"></div>
<div class="mut" id="upd">loading…</div></header>
<div class="strip" id="strip"></div><div class="layout"><div class="grid" id="grid"></div><div class="side" id="side"></div></div>
<script>
const INLINE=/*INLINE_DATA*/null;
const TZ='America/Denver';
const fmt=(iso,withDate)=>{if(!iso)return'—';const d=new Date(iso);if(isNaN(d))return esc(iso);
 return d.toLocaleString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',second:withDate?undefined:'2-digit',month:withDate?'short':undefined,day:withDate?'numeric':undefined})+' MDT'};
const ago=iso=>{if(!iso)return'';const s=(Date.now()-new Date(iso))/1000;if(isNaN(s))return'';if(s<90)return Math.round(s)+'s ago';if(s<5400)return Math.round(s/60)+'m ago';return (s/3600).toFixed(1)+'h ago'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=s=>s?esc(String(s).slice(0,8)):'—';
let prevDone={};
function ciPill(ci){if(!ci)return'<span class="pill">unknown</span>';const c=ci.counts||{};const cls=ci.state==='success'?'p-ok':ci.state==='failure'?'p-bad':ci.state==='pending'?'p-prog':'';
 return `<span class="pill ${cls}">${esc(ci.state)}</span> <span class="mut">${c.success||0}✓ ${c.pending||0}… ${c.failure||0}✗</span>`}
function prBlock(pr){if(!pr)return'<div class="mut">unknown</div>';if(pr.error&&!pr.number)return`<div class="flag">GitHub: ${esc(pr.error)}</div>`;
 if(!pr.number)return`<div class="mut">${esc(pr.note||'no PR')}</div>`;
 const rv=pr.last_review?`${esc(pr.last_review.author)} ${esc(pr.last_review.state)} @${esc(pr.last_review.commit)}`:'no reviews';
 return `<table><tr><td>PR</td><td><a href="${esc(pr.url)}" target="_blank">#${pr.number}</a> ${esc(pr.state)}${pr.draft?' (draft)':''} ${pr.note?'<span class="mut">— '+esc(pr.note)+', showing latest merged</span>':''}<br><span class="mut">${esc(pr.title)}</span></td></tr>
 <tr><td>Head</td><td class="mono">${sha(pr.head)} <span class="mut">${esc(pr.branch)}</span></td></tr>
 <tr><td>CI</td><td>${ciPill(pr.ci)} ${pr.ci&&pr.ci.failing&&pr.ci.failing.length?'<br><span class="p-bad">'+esc(pr.ci.failing.join(', '))+'</span>':''}</td></tr>
 <tr><td>Review</td><td>${pr.exact_head_approved?'<span class="pill p-ok">exact head approved</span> ':'<span class="pill">no exact-head approval</span> '}${esc(pr.review_decision||'')} <span class="mut">last: ${rv}</span></td></tr>
 ${pr.merged_at?`<tr><td>Merged</td><td>${fmt(pr.merged_at,1)}</td></tr>`:''}
 <tr><td></td><td class="mut">GitHub fetched ${fmt(pr.fetched_utc)} (cached ≤2 min)</td></tr></table>`}
function extra(k,p){let h='';
 if(k==='joil'){const v=p.validator||{};const l=p.lease||{};
  h+=`<h3>Validator (joil_v5_audit) & lease</h3><table><tr><td>Latest audit</td><td>${esc(v.audit||'unknown')} · observed ${fmt(v.observed_utc)}</td></tr>
  <tr><td>Canonical</td><td>${v.canonical?`${v.canonical.done} done / ${v.canonical.review} review / ${v.canonical.todo} todo`:'unknown'}</td></tr>
  <tr><td>Mentions</td><td><span class="p-ok">VERIFIED ×${v.verified_mentions??'?'}</span> · <span class="${v.weak_mentions?'p-bad':''}">WEAK ×${v.weak_mentions??'?'}</span> · <span class="${v.fail_mentions?'p-bad':''}">FAIL ×${v.fail_mentions??'?'}</span> <span class="mut">(word counts in latest section)</span></td></tr>
  <tr><td>Audit-held</td><td>${(v.audit_held||[]).map(esc).join(', ')||'none'}</td></tr>
  <tr><td>Packets accepted</td><td>${p.packets_accepted??'?'} / ${p.packets_total??'?'} <span class="mut">(all 5 tasks done)</span></td></tr>
  <tr><td>Lease expires</td><td>${fmt(l.expires_utc,1)} <span class="mut">(${l.renewals??'?'} renewal(s))</span></td></tr></table>`}
 if(k==='dope'){const b=p.by_kind||{};h+=`<h3>Ledger</h3><table><tr><td>Revision</td><td>${esc(p.ledger_revision)} · updated ${fmt(p.ledger_updated_utc)}</td></tr>
  <tr><td>Planning</td><td>${b.planning_done}/${b.planning_total}</td></tr><tr><td>Implementation</td><td>${b.impl_done}/${b.impl_total}</td></tr>
  <tr><td>Leases</td><td>${(p.leases||[]).map(l=>esc(l.owner)+' → '+esc((l.tasks||[]).join(','))).join('<br>')||'none'}</td></tr></table>`}
 if(k==='jopedime'){const ls=p.live_status||{};const a=ls.active_task;h+=`<h3>Live status</h3><table><tr><td>LIVE_STATUS</td><td>updated ${fmt(ls.updated_utc)}</td></tr>
  <tr><td>Active</td><td>${a?esc(a.task)+' · '+esc(a.owner)+' · '+esc(a.branch)+' · lease to '+fmt(a.lease_expires_utc):'none'}</td></tr>
  <tr><td>Assigned (captain-state)</td><td>${(p.assigned_from_captain_state||[]).map(esc).join(', ')||'none'}</td></tr></table>`}
 if(k==='jarambit'){const w=p.waves||{};const L=w.latest_completed;h+=`<h3>Evolution waves</h3><table>
  <tr><td>Latest completed</td><td>${L?`${esc(L.wave)}: ${L.qualified}/${L.assessed} qualified · champion ${L.champion?esc(JSON.stringify(L.champion)).slice(0,60):'none'} · ${fmt(L.mtime_utc)}`:'unknown'}</td></tr>
  ${L&&L.best?`<tr><td>Best design</td><td class="mono">${esc(L.best.label)} W_CAD=${esc(L.best.w_cad)} battery ${esc(L.best.battery_pass_count)} · all16=${esc(L.best.all_16_gates)} rsv2=${esc(L.best.rs_v2_all_hard)}</td></tr>`:''}
  <tr><td>Recent</td><td>${(w.recent_completed||[]).map(r=>esc(r.wave)+' '+r.qualified+'/'+r.assessed).join(' · ')}</td></tr>
  <tr><td>Running</td><td>${(w.running_or_pending||[]).map(esc).join(', ')||'none'}</td></tr>
  <tr><td>Certified designs</td><td><b>${w.certified_designs_total??'?'}</b> <span class="mut">${esc(w.scope)}</span></td></tr>
  ${(w.legacy_champion_waves||[]).length?`<tr><td>Legacy champions</td><td class="mut">${w.legacy_champion_waves.length} older waves (${esc(w.legacy_champion_waves[0])}…${esc(w.legacy_champion_waves.slice(-1)[0])}) — ${esc(w.legacy_note)}</td></tr>`:''}
  ${p.declared_counter?`<tr><td>Plan's own counter</td><td>${p.declared_counter.done} / ${p.declared_counter.total} <span class="mut">${esc(p.declared_counter.note)}; bar above counts all ${p.total} parsed table rows</span></td></tr>`:''}</table>`}
 return h}
function card(k,p){const t=p.total,d=p.done||0,c=p.counts||{};const pct=t?(100*d/t):0;
 const w=x=>t?(100*(x||0)/t).toFixed(2)+'%':'0';const cap=p.captain||{};
 const flash=prevDone[k]!==undefined&&prevDone[k]!==d?'new':'';prevDone[k]=d;
 const capState=!cap.alive?'<span class="pill p-bad">screen missing</span>':cap.agent_running?'<span class="pill p-ok">alive</span>':'<span class="pill p-bad">no agent process</span>';
 return `<div class="card"><h2><span>${esc(p.name)}</span><span class="${flash}">${t?`${d} / ${t} · ${pct.toFixed(1)}%`:'<span class="stale">unknown</span>'}</span></h2>
 <div class="mut">${esc(p.ledger_source||'')}</div>
 <div class="bar"><span class="done" style="width:${w(c.done)}"></span><span class="inprog" style="width:${w(c.in_progress)}"></span><span class="blk" style="width:${w(c.blocked)}"></span></div>
 <div class="counts"><span><i class="dot done"></i>done ${c.done??'?'}</span><span title="${(p.in_progress_breakdown||{}).label||''}"><i class="dot inprog"></i>in progress ${c.in_progress??'?'}${p.in_progress_breakdown?' (ledger '+p.in_progress_breakdown.ledger_state+' + claims/lanes '+p.in_progress_breakdown.active_claims_and_lanes+')':''}</span><span><i class="dot blk"></i>blocked ${c.blocked??'?'}</span><span><i class="dot" style="background:var(--open)"></i>open ${c.open??'?'}</span>
 <span class="mut">raw: ${esc(Object.entries(p.raw_status_counts||{}).map(([a,b])=>a+'='+b).join(' '))}</span></div>
 ${(p.flags||[]).map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join('')}
 <h3>Recently changed tasks</h3>${(p.recent||[]).length?`<table>${p.recent.map(r=>`<tr><td class="mono">${esc(r.task)}</td><td>${esc(r.old||'∅')} → <b>${esc(r.new)}</b>${r.note?'<br><span class="mut">'+esc(r.note)+'</span>':''}</td><td>${fmt(r.at,1)}</td><td class="mut">${esc(r.source)}</td></tr>`).join('')}</table>`:'<div class="mut">none recorded yet</div>'}
 ${extra(k,p)}
 <h3>Captain ${esc(cap.id)} ${capState} <span class="mut">${esc(cap.model||'')} · screen changed ${ago(cap.screen_changed_utc)}</span></h3>
 <pre>${esc((cap.tail||[]).join('\n'))||'(no hardcopy yet)'}</pre>
 <h3>Worker screens (${(p.workers||[]).filter(x=>x.agent_running).length} with agent running, ${(p.workers||[]).length} total)</h3><table><tr><th>Screen</th><th>Model</th><th>Task</th><th>Status</th></tr>
 ${(p.workers||[]).filter(x=>x.agent_running).map(x=>`<tr><td class="mono">${esc(x.name)}</td><td>${esc(x.model||x.agent||'—')}</td><td>${esc(x.task||'—')}${x.task_source?'<br><span class="mut">'+esc(x.task_source)+'</span>':''}</td><td>${x.agent_running?'<span class="p-ok">agent running</span>':'<span class="mut">shell only</span>'}<br><span class="mut">${x.screen_changed_utc?'changed '+ago(x.screen_changed_utc):''}</span></td></tr>`).join('')}</table>
 ${(p.workers||[]).filter(x=>!x.agent_running).length?`<div class="mut" style="margin-top:4px">Shell-only / finished screens: ${(p.workers||[]).filter(x=>!x.agent_running).map(x=>esc(x.name)).join(', ')}</div>`:''}
 <h3>Integration PR</h3>${prBlock(p.pr)}
 <h3>Coordination log (last 5) <span class="mut">${esc((p.coord_log||{}).path||'')} · ${fmt((p.coord_log||{}).mtime_utc)}</span></h3>
 <pre>${esc(((p.coord_log||{}).tail||['unknown']).join('\n'))}</pre></div>`}

const TIERCLS=(fam,model,tier)=>fam==='agy'?'t-agy':fam==='claude'?'t-claude':/luna/.test(model||'')&&tier!=='dominated'?'t-cheap':/astra/.test(model||'')||tier==='dominated'?'t-top':/sol|terra/.test(model||'')?'t-mid':'t-unk';
const famOf=m=>/^agy/.test(m||'')?'agy':/^claude/.test(m||'')?'claude':/gpt|codex/.test(m||'')?'codex':'unknown';
const lv=l=>l==='red'?'lv-red':l==='amber'?'lv-amber':'lv-ok';
const gb=b=>(b/1e9).toFixed(0)+' GB';
function badge(model,effort,tier){const f=famOf(model);return `<span class="badge ${TIERCLS(f,model,tier)}">${esc((model||'unknown').replace(/^agy /,'agy · ').replace('Gemini ','Gem '))}${effort?' '+esc(effort):''}${tier&&/^T\d/.test(tier)?' · '+esc(tier):''}</span>`}
const hyg=(x,long)=>{if(!x)return'<span class="mut">not scored yet</span>';const g=x.grade||'?';const cls=g==='A'?'lv-ok':g==='B'?'lv-ok':g==='C'?'lv-amber':'lv-red';
 return `<span class="${cls}">${esc(g)} ${x.score??''}</span>`+(long?`<br><span class="mut">stale wt ${x.stale_merged_worktrees??'?'} · uncommitted&gt;45m ${x.uncommitted_over_45m??'?'} · behind ${x.lanes_behind??'?'}${x.temp_growth_gb!=null?' · tmp +'+x.temp_growth_gb+' GB':''}</span>${(x.notes||[]).length?'<br><span class="mut">'+x.notes.slice(0,2).map(esc).join('; ')+'</span>':''}`:'')};
function hierarchy(s){const h=s.hierarchy;if(!h)return'<div class="mut">hierarchy unavailable</div>';const sc=h.super_captain||{};const scs=(s.super_captain||{});
 const last=scs.last_check?`check #${esc(scs.last_check.no)} ${fmt(scs.last_check.utc,1)}`:((scs.status||{}).updated_utc?'updated '+fmt(scs.status.updated_utc,1):'no check logged yet');
 let o=`<div class="chain"><div class="node"><b>Jepson</b><span class="mut small">owner · his typed prompts override everyone</span></div><div class="arrow">→</div>
 <div class="node"><b>${esc(h.grokbot.name)}</b><span class="mut small">${h.grokbot.routines.length} routines, 30 min each, talk only to super_captain/captains</span></div><div class="arrow">→</div>
 <div class="node sc"><b>super_captain <span class="sd s-${esc(sc.state)}"></span><span class="mut small">${esc(sc.state)}</span></b>${badge(sc.model)} <span class="mut small">${esc(sc.screen)} · ticker ${sc.ticker_alive?'✓':'✗'} · ${last}</span></div></div>
 <div class="capcols">`;
 for(const c of h.captains){const ws=c.workers||[];const live=ws.filter(w=>!['finished','gone'].includes(w.state));const fin=ws.filter(w=>['finished','gone'].includes(w.state));
  const cnt={};live.forEach(w=>cnt[w.state]=(cnt[w.state]||0)+1);const cc=c.counts||{};
  o+=`<div class="capcol"><div class="caphead"><b>${esc(c.name)}</b> <span class="sd s-${esc(c.state)}"></span><span class="mut small">${esc(c.state)}</span><br>${badge(c.model)}<div class="mut small mono">${esc(c.screen)}</div>
  <div class="small">${c.total?`${c.done}/${c.total} done · <span style="color:var(--prog)">${cc.in_progress??'?'} in progress</span>`:''}</div>
  <div class="small">hygiene ${hyg((((s.super_captain||{}).status||{}).captains||{})[c.key]&&(((s.super_captain||{}).status||{}).captains||{})[c.key].hygiene)}</div>
  <div class="small mut">${Object.entries(cnt).map(([k,v])=>`<span class="sd s-${k}"></span>${v} ${k}`).join(' ')}</div></div>
  ${live.map(w=>`<div class="wk" title="${esc((w.flags||[]).join('; '))}"><span class="sd s-${esc(w.state)}"></span><span class="nm">${esc(w.screen)}</span>${w.host&&w.host!=='xbabe2'?` <span class="badge" style="background:#58a6ff">${esc(w.host)}</span>`:''}${(w.flags||[]).length?' <span class="lv-red">⚑</span>':''}<br>${badge(w.model,w.effort,w.tier)} ${w.task?'<span class="mono">'+esc(w.task)+'</span>':''}</div>`).join('')}
  ${fin.length?`<div class="mut small" style="margin-top:4px" title="${esc(fin.map(w=>w.screen).join(', '))}">+${fin.length} finished / shell-only screens</div>`:''}</div>`}
 o+='</div>';
 if((h.unassigned||[]).length)o+=`<div class="mut small" style="margin-top:6px">Not under a captain: ${h.unassigned.map(u=>esc(u.screen)+' ('+esc(u.model)+')').join(', ')}</div>`;
 o+=`<div class="mut small" style="margin-top:4px"><span class="sd s-active"></span>active (screen changed &lt;5 min) <span class="sd s-idle"></span>idle <span class="sd s-blocked"></span>blocked/quota <span class="sd s-remote"></span>remote host · badges: <span class="badge t-cheap">Luna T0/T1</span> <span class="badge t-mid">6.1 Sol T2/T3</span> <span class="badge t-top">Astra/dominated</span> <span class="badge t-agy">agy planner</span> <span class="badge t-claude">Claude</span></div>`;

 o+=mini('q','Codex weekly quota used % (real)',last.quota_pct!=null?`${last.quota_pct}% · ${last.credits_h??'?'} cr/h est.`:'<span class="mut">no data yet</span>',spark([{color:'#58a6ff',pts:R.map(r=>[t(r),r.quota_pct])}],{min:0}),'resets '+fmt((te.quota||{}).resets_at_utc,1));
 el.innerHTML=o;el.querySelectorAll('.mini').forEach(m=>{if(BIG[m.dataset.id])m.classList.add('big')})}
function yieldPanel(s){const ty=s.token_yield;if(!ty||!ty.total)return `<div class="card"><h2><span>Token yield</span></h2><div class="mut">no data yet (first token_yield.py pass takes ~5 min)</div></div>`;
 const P=['joil','dope','jopedime','jarambit','other'];const row=(n,v)=>v?`<tr><td><b>${esc(n)}</b></td><td>${v.sessions}</td><td>${fmtN(v.tokens)}<br><span class="mut">${fmtN(v.output)} out</span></td><td>${v.credits!=null?Math.round(v.credits):'—'}</td><td>${v.yield_integration_credits_pct??'—'}% <span class="mut">(${v.yield_integration_pct??'—'}% tok)</span></td><td class="lv-ok">${v.yield_main_credits_pct??'—'}% <span class="mut">(${v.yield_main_pct??'—'}% tok)</span></td><td>${v.wasted_pct_est??'—'}%</td><td>${v.coverage_pct??'—'}%</td><td>${v.credits_per_done_todo??'—'}</td><td>${v.integration_commits||0}/${v.main_commits||0}</td></tr>`:'';
 let o=`<table class="small"><tr><th>Project</th><th>Sess.</th><th>Tokens</th><th>Credits (est.)</th><th>Yield → integration</th><th>Yield → main</th><th>No-commit</th><th>Coverage</th><th>Credits / done ToDo</th><th>Commits int/main</th></tr>${P.map(k=>row(k,(ty.projects||{})[k])).join('')}${row('TOTAL',ty.total)}</table>`;
 o+=`<h3>Yield by model tier</h3><table class="small"><tr><th>Tier</th><th>Sessions</th><th>Tokens</th><th>Credits</th><th>Credits on main</th><th>Tokens on main</th></tr>${Object.entries(ty.by_tier||{}).map(([k,v])=>`<tr><td><span class="badge ${TIERCLS(k==='claude'?'claude':'codex',k,'')}">${esc(k)}</span></td><td>${v.sessions}</td><td>${fmtN(v.tokens)}</td><td>${v.credits!=null?Math.round(v.credits):'—'}</td><td>${v.main_credits!=null?Math.round(v.main_credits):'—'} ${v.credits?'('+(100*(v.main_credits||0)/v.credits).toFixed(0)+'%)':''}</td><td>${fmtN(v.main_tokens||0)} ${v.tokens?'('+(100*(v.main_tokens||0)/v.tokens).toFixed(0)+'%)':''}</td></tr>`).join('')}</table>`;
 o+=`<div class="mut small" style="margin-top:4px">${esc(ty.method)} Trailer-matched commits: ${ty.trailer_matched_commits||0}. Updated ${fmt(ty.generated_utc,1)} (${ago(ty.generated_utc)}), every ~10 min. Not covered: ${esc((ty.not_covered||[]).join(', '))}.</div>`;
 return `<div class="card"><h2><span>Token yield (estimate) · last ${esc(String(ty.window_hours))}h</span><span class="mut small">tokens generated → landed on integration PR → landed on main</span></h2>${o}</div>`}
function renderSide(s){const el=document.getElementById('side');if(!el)return;
 el.innerHTML=hierarchy(s)+tokenPanel(s)+yieldPanel(s)+superPanel(s)+(s.extras_error?`<div class="flag">extras error: ${esc(s.extras_error)}</div>`:'')}
function render(s){try{renderStrip(s)}catch(e){document.getElementById('strip').innerHTML='<div class=flag>strip error: '+esc(e)+'</div>'}try{renderSide(s)}catch(e){document.getElementById('side').innerHTML='<div class=flag>side panel error: '+esc(e)+'</div>'}
const ps=s.order.map(k=>[k,s.projects[k]]).filter(x=>x[1]);
 document.getElementById('sum').innerHTML=ps.map(([k,p])=>{const fl=(p.flags||[]).length;return `<div class="chip"><div>${esc(p.name)} ${fl?'<span class="p-bad">⚠'+fl+'</span>':''}</div><b>${p.total?p.done+'/'+p.total:'?'}</b> <span class="mut">${p.total?(100*p.done/p.total).toFixed(1)+'%':''}</span>
  <div class="mut">PR ${p.pr&&p.pr.number?'#'+p.pr.number+' '+((p.pr.ci||{}).state||''):'—'} · captain ${(p.captain||{}).agent_running?'✓':'✗'}</div></div>`}).join('');
 const age=(Date.now()-new Date(s.generated_utc))/1000;
 document.getElementById('upd').innerHTML=`Last update <b>${fmt(s.generated_utc,1)}</b> <span class="${age>180?'stale':''}">(${ago(s.generated_utc)})</span>${INLINE?' · <b>static snapshot</b>':' · auto-refresh 15s'}`;
 document.getElementById('grid').innerHTML=ps.map(([k,p])=>card(k,p)).join('')}
async function poll(){try{const r=await fetch('status.json?'+Date.now(),{cache:'no-store'});render(await r.json())}catch(e){document.getElementById('upd').textContent='fetch failed: '+e}}
if(INLINE){render(INLINE)}else{poll();setInterval(poll,15000);setInterval(()=>{},1000)}
