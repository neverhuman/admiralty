[package]
license.workspace = true
name = "admiralty-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Read-only super-captain fleet audit (Rust port of tools/sc_audit.py and native_queue_health.py)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
chrono.workspace = true
# `hooks` (no extra crates) provides the SQLite progress handler used to bound
# the read-only queue observation exactly like the Python version.
rusqlite = { workspace = true, features = ["hooks"] }
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
